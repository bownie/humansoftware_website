name: Deploy to Cloudflare Pages

# Runs next to the GitHub Pages workflow, which stays in place until the
# Cloudflare project is live and the DNS has moved. Until CLOUDFLARE_API_TOKEN
# exists in the repository secrets this job builds but skips the upload, so it
# cannot fail a push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          ASTRO_BASE: ${{ vars.ASTRO_BASE }}

      - name: Check for Cloudflare credentials
        id: credentials
        run: echo "configured=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # `wrangler pages deploy --project-name` refuses to run against a project
      # that does not exist yet, and the prompt that would create one needs a
      # TTY that a runner does not have. Create it once, then deploy into it.
      - name: Ensure the Pages project exists
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw humansoftware-website; then
            echo "The humansoftware-website project already exists."
          else
            npx --yes wrangler@4 pages project create humansoftware-website --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must match `name` in wrangler.toml and the project in Cloudflare.
          command: pages deploy dist --project-name=humansoftware-website
