# Cloudflare Workers static assets config for the project the dashboard created,
# "humansoftware-website". Its Git integration runs `npm run build` and then
# `wrangler deploy`, which uploads ./dist together with the _redirects and
# _headers files the Astro integration writes into it.
#
# `wrangler deploy` cannot read `pages_build_output_dir`, which is what this
# file used to declare: that is a Pages-only field, and it is why the first
# dashboard build failed.
name = "humansoftware-website"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
